<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Goliath National Bank Line-up System</title>

    <link href="assets/main.css" rel="stylesheet">
</head>

<body data-service="deposit">
    <header id="header" class="header">
        <div>
            <a href="index.html" class="logo">
                <h1 class="sitename">Goliath National Bank</h1>
            </a>
        </div>
    </header>

    <main class="main-one">
        <section id="take-number" class="container">
            <div class="return">
                <a href="index.html" class="first-page">
                    <button>&larr;</button>
                </a>
                <p>Open a diposit account</p>
            </div>
            <div class="take-number">
                <button id="take-number-btn">Take a number</button>
            </div>
            <div class="ticket-info" id="ticket-info" style="display: none;">
                <p>Number: <span id="ticket-number"></span></p>
                <p>Service: Opening a diposit account</p>
                <p>Wait time: ~15 min</p>
            </div>
        </section>
    </main>

    <footer id="footer" class="footer">
        <div class="container">
            <h3>Contacts</h3>
            <p>Phone: +370 613 92 676</p>
            <p>Email: aidanak100@gmail.com</p>
        </div>
    </footer>

    <script src="assets/main.js"></script>

</body>
</html>
